<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!-- raised arms -->
  <path d="M66,122 C40,112 28,95 34,78" fill="none" stroke="#332419" stroke-width="9" stroke-linecap="round"/>
  <circle cx="32" cy="72" r="15" fill="#FFFBF4" stroke="#332419" stroke-width="6"/>
  <path d="M134,122 C160,112 172,95 166,78" fill="none" stroke="#332419" stroke-width="9" stroke-linecap="round"/>
  <circle cx="168" cy="72" r="15" fill="#FFFBF4" stroke="#332419" stroke-width="6"/>

  <!-- body/coat -->
  <rect x="58" y="110" width="84" height="90" rx="26" fill="#FFFBF4" stroke="#332419" stroke-width="6"/>
  <path d="M86,112 L100,128 L114,112" fill="none" stroke="#332419" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="100" cy="150" r="4.5" fill="#332419"/>
  <circle cx="100" cy="167" r="4.5" fill="#332419"/>

  <!-- baguette in pocket -->
  <rect x="116" y="148" width="20" height="15" rx="3" fill="none" stroke="#332419" stroke-width="4"/>
  <rect x="119" y="120" width="9" height="32" rx="4.5" fill="#E3B873" stroke="#332419" stroke-width="4"/>
  <line x1="121.5" y1="128" x2="126" y2="124" stroke="#332419" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="121.5" y1="136" x2="126" y2="132" stroke="#332419" stroke-width="1.5" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="100" cy="72" r="44" fill="#FFFBF4" stroke="#332419" stroke-width="6"/>

  <!-- crown -->
  <polygon points="66,46 76,20 88,38 100,14 112,38 124,20 134,46" fill="#E3B873" stroke="#332419" stroke-width="5" stroke-linejoin="round"/>
  <line x1="66" y1="46" x2="134" y2="46" stroke="#332419" stroke-width="5" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="66" cy="86" rx="9" ry="6" fill="#E3B873" opacity="0.55"/>
  <ellipse cx="134" cy="86" rx="9" ry="6" fill="#E3B873" opacity="0.55"/>

  <!-- eyes (happy closed) -->
  <path d="M78,72 Q86,62 94,72" fill="none" stroke="#332419" stroke-width="5" stroke-linecap="round"/>
  <path d="M106,72 Q114,62 122,72" fill="none" stroke="#332419" stroke-width="5" stroke-linecap="round"/>

  <!-- smile -->
  <path d="M84,94 Q100,108 116,94" fill="none" stroke="#332419" stroke-width="5" stroke-linecap="round"/>
</svg>
